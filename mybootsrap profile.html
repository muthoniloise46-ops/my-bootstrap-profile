
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOISE MUTHONI - Student Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
        }

        .profile-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            overflow: hidden;
        }

        .profile-picture img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-weight: bold;
            margin-top: 20px;
        }

        .status {
            background: #198754;
            color: white;
            padding: 8px;
            border-radius: 6px;
        }

        .section-title {
            color: #315da8;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container profile-container">

    <div class="row">

        <!-- LEFT PROFILE SECTION -->
        <div class="col-md-4 text-center border-end">

            <div class="profile-picture">
                <img src="profile.jpg" alt="Loise Muthoni">
            </div>

            <h3 class="profile-name">LOISE MUTHONI</h3>

            <p class="text-muted">BBIT Student</p>

            <p class="status">Active Student</p>

            <hr>

            <p class="text-start">📧 2409451@students.kcau.ac.ke</p>
            <p class="text-start">📞 +254 708 692 330</p>
            <p class="text-start">📍 Nairobi, Kenya</p>

        </div>

        <!-- RIGHT INFORMATION SECTION -->
        <div class="col-md-8 ps-md-4">

            <h4 class="section-title mb-4">
                👤 Personal & Academic Information
            </h4>

            <form>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control"
                               value="Loise Muthoni">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Registration Number</label>
                        <input type="text" class="form-control"
                               placeholder="24/09451">
                    </div>

                </div>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Course</label>
                        <input type="text" class="form-control"
                               value="Bachelor of Business Information Technology">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control"
                               value="School of Technology">
                    </div>

                </div>

                <div class="mb-4">
                    <label class="form-label">Bio / Notes</label>

                    <textarea class="form-control" rows="4">I am a BBIT student at KCA University with an interest in information technology, web application development, database management and innovation.</textarea>
                </div>

                <hr>

                <div class="text-end">

                    <button type="reset"
                            class="btn btn-outline-secondary">
                        Cancel
                    </button>

                    <button type="button"
                            class="btn btn-primary">
                        ☑ Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
